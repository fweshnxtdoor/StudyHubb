<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: url('https://i.pinimg.com/originals/a4/0b/e8/a40be86c158154a3ab91f610fccb2eb7.gif') no-repeat center center fixed;
      background-size: 100vw 100vh; /* Stretch the portrait image to fit landscape */
      color: #fff;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      overflow: hidden;
    }

    @keyframes gradientAnimation {
      0% {
        background-position: 0% 50%, 0 0;
      }
      50% {
        background-position: 100% 50%, 50px 50px;
      }
      100% {
        background-position: 0% 50%, 0 0;
      }
    }

    .login-container {
      background-color: rgba(31, 31, 31, 0.9); /* Slight transparency for the container */
      padding: 2rem;
      border-radius: 15px;
      box-shadow: 0 8px 16px rgba(0, 0, 0, 0.5);
      width: 350px;
      text-align: center;
      animation: fadeIn 0.8s ease-in-out;
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(-20px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .login-container h1 {
      color: #ffcc00;
      margin-bottom: 1.5rem;
      text-shadow: 2px 2px 5px rgba(0, 0, 0, 0.5);
      font-size: 2rem;
    }

    .login-container input[type="text"] {
      width: 100%;
      padding: 0.75rem;
      margin-bottom: 1.5rem;
      border: none;
      border-radius: 5px;
      background-color: #2a2a2a;
      color: #fff;
      font-size: 1rem;
      transition: box-shadow 0.3s ease;
    }

    .login-container input[type="text"]:focus {
      outline: none;
      box-shadow: 0 0 8px #ffcc00;
    }

    .login-container button {
      width: 100%;
      padding: 0.75rem;
      border: none;
      border-radius: 5px;
      background-color: #ffcc00;
      color: #000;
      font-size: 1rem;
      cursor: pointer;
      transition: background-color 0.3s ease, transform 0.3s ease;
    }

    .login-container button:hover {
      background-color: #e6b800;
      transform: scale(1.05);
    }

    .login-container button:active {
      transform: scale(0.95);
    }

    .login-container p {
      margin-top: 1rem;
      font-size: 0.9rem;
      color: #ccc;
    }

    .login-container p a {
      color: #ffcc00;
      text-decoration: none;
      transition: color 0.3s ease;
    }

    .login-container p a:hover {
      color: #fff;
    }

    /* Loading screen styles */
    .loading-screen {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-color: #121212;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 1000;
      transition: opacity 0.5s ease, visibility 0.5s ease;
    }

    .loading-logo-container {
      display: flex;
      align-items: center;
      gap: 15px; /* Space between the logo and the loading circle */
    }

    .loading-spinner {
      border: 4px solid rgba(255, 255, 255, 0.2);
      border-top: 4px solid #ffcc00;
      border-radius: 50%;
      width: 50px;
      height: 50px;
      animation: spin 1s linear infinite;
    }

    @keyframes spin {
      0% {
        transform: rotate(0deg);
      }
      100% {
        transform: rotate(360deg);
      }
    }

    .loading-tips {
      position: absolute;
      bottom: 20px;
      color: #ffcc00;
      font-size: 1rem;
      text-align: center;
      animation: fadeInOut 3s infinite;
    }

    @keyframes fadeInOut {
      0%, 100% {
        opacity: 0;
      }
      50% {
        opacity: 1;
      }
    }

    .loading-logo {
      font-family: Arial, sans-serif;
      font-size: 2rem;
      font-weight: bold;
      color: #ffcc00;
      text-shadow: 2px 2px 5px rgba(0, 0, 0, 0.5);
      margin-bottom: 30px; /* Increased margin to separate from the loading circle */
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .loading-logo span {
      padding: 4px 8px;
      border-radius: 3px;
    }

    .loading-logo .logo-black {
      background-color: #000;
      color: #fff;
      border-radius: 3px 0 0 3px;
    }

    .loading-logo .logo-yellow {
      background-color: #ffcc00;
      color: #000;
      border-radius: 0 3px 3px 0;
    }

    .loading-quote {
      display: none; /* Hide the quote */
    }

    .hidden {
      opacity: 0;
      visibility: hidden;
    }
  </style>
</head>
<body>
  <div class="loading-screen" id="loadingScreen">
    <div class="loading-logo-container">
      <div class="loading-logo">
        <span class="logo-black">Study</span><span class="logo-yellow">Hub</span>
      </div>
      <div class="loading-spinner"></div>
    </div>
    <div class="loading-tips" id="loadingTips">Loading...</div>
  </div>

  <div class="login-container">
    <div class="logo" style="margin-bottom: 1.5rem;">
      <span style="background-color: #000; color: #fff; padding: 4px 8px; border-radius: 3px 0 0 3px;">Study</span>
      <span style="background-color: #FFA500; color: #000; padding: 4px 8px; border-radius: 0 3px 3px 0;">Hub</span>
    </div>
    <h1>Login</h1>
    <form id="loginForm">
      <label for="name">Enter your name:</label>
      <input type="text" id="name" name="name" required />
      <button type="submit">Login</button>
    </form>
  </div>
  <script>
    // Random study tips
    const studyTips = [
      "Take regular breaks to stay focused.",
      "Use the Pomodoro Technique for effective studying.",
      "Test yourself with flashcards to improve memory.",
      "Find a quiet and distraction-free study space.",
      "Stay hydrated and eat healthy snacks while studying."
    ];

    // Show loading screen on page load
    window.addEventListener('load', () => {
      const loadingScreen = document.getElementById('loadingScreen');
      const loadingTips = document.getElementById('loadingTips');

      // Display random study tips
      let tipIndex = 0;
      setInterval(() => {
        loadingTips.textContent = studyTips[tipIndex];
        tipIndex = (tipIndex + 1) % studyTips.length;
      }, 3000); // Change tip every 3 seconds

      setTimeout(() => {
        loadingScreen.classList.add('hidden'); // Add the hidden class to hide the loading screen
      }, 1000); // Hide loading screen after 1 second
    });

    // Handle login form submission
    document.getElementById('loginForm').addEventListener('submit', (event) => {
      event.preventDefault();
      const name = document.getElementById('name').value;
      localStorage.setItem('userName', name); // Save the name to localStorage
      window.location.href = 'index.html'; // Redirect to the homepage
    });
  </script>
</body>
</html>
