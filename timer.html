<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Study Timer</title>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@700&display=swap" rel="stylesheet">
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: url('https://cdn.mos.cms.futurecdn.net/cwfPWpSeMWWZPSMjNvgjzJ.gif') no-repeat center center fixed;
      background-size: cover;
      color: #fff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
    }

    header {
      font-family: 'Roboto', sans-serif;
      font-size: 2.5rem;
      font-weight: bold;
      margin-bottom: 1rem;
      text-align: center;
      position: absolute;
      top: 20px;
      width: 100%;
      padding: 10px 0; /* Remove yellow background */
      border-radius: 5px;
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
    }

    .timer-container {
      text-align: center;
      margin-top: 80px; /* Adjust to avoid overlap with the header */
      background-color: rgba(0, 0, 0, 0.7); /* Add a semi-transparent background for better readability */
      padding: 20px;
      border-radius: 10px;
    }

    .timer-display {
      font-size: 3rem;
      margin-bottom: 1rem;
    }

    .timer-controls {
      display: flex;
      justify-content: center; /* Align buttons horizontally */
      gap: 10px;
      margin-bottom: 1rem;
    }

    .timer-controls button {
      padding: 0.75rem 1.5rem;
      font-size: 1rem;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      background-color: #ffcc00;
      color: #000;
      transition: background-color 0.3s ease;
    }

    .timer-controls button:hover {
      background-color: #e6b800;
    }

    .timer-settings {
      margin-top: 1rem;
    }

    .timer-settings input {
      width: 80px; /* Increased width for input fields */
      padding: 0.5rem;
      font-size: 1rem;
      border: none;
      border-radius: 5px;
      text-align: center;
    }

    .timer-settings label {
      margin-right: 10px;
    }
  </style>
</head>
<body>
  <header>
    <span style="background-color: #000; color: #fff; padding: 5px 10px; border-radius: 5px 0 0 5px;">STUDY</span>
    <span style="background-color: #ffcc00; color: #000; padding: 5px 10px; border-radius: 0 5px 5px 0;">TIMER</span>
    <a href="index.html" style="position: absolute; top: 20px; right: 20px; text-decoration: none; background-color: #ffcc00; color: #000; padding: 10px 15px; border-radius: 5px; font-size: 1rem; font-weight: bold; transition: background-color 0.3s ease;">
      Home
    </a>
  </header>
  <div class="timer-container">
    <div class="timer-display" id="timerDisplay">00:00</div>
    <div class="timer-controls">
      <button id="startButton">Start</button>
      <button id="pauseButton">Pause</button>
      <button id="resetButton">Reset</button>
    </div>
    <div class="timer-settings">
      <label for="studyTime">Study (min):</label>
      <input type="number" id="studyTime" value="25" min="1">
      <label for="breakTime">Break (min):</label>
      <input type="number" id="breakTime" value="5" min="1">
    </div>
  </div>

  <script>
    let timerInterval;
    let isStudyTime = true;
    let remainingTime = 0;

    const timerDisplay = document.getElementById('timerDisplay');
    const startButton = document.getElementById('startButton');
    const pauseButton = document.getElementById('pauseButton');
    const resetButton = document.getElementById('resetButton');
    const studyTimeInput = document.getElementById('studyTime');
    const breakTimeInput = document.getElementById('breakTime');

    function updateTimerDisplay() {
      const minutes = Math.floor(remainingTime / 60);
      const seconds = remainingTime % 60;
      timerDisplay.textContent = `${String(minutes).padStart(2, '0')}:${String(seconds).padStart(2, '0')}`;
    }

    function startTimer() {
      if (remainingTime <= 0) {
        remainingTime = (isStudyTime ? parseInt(studyTimeInput.value) : parseInt(breakTimeInput.value)) * 60;
      }
      timerInterval = setInterval(() => {
        if (remainingTime > 0) {
          remainingTime--;
          updateTimerDisplay();
        } else {
          clearInterval(timerInterval);
          isStudyTime = !isStudyTime;
          alert(isStudyTime ? "Time to study!" : "Time to take a break!");
          startTimer();
        }
      }, 1000);
    }

    function pauseTimer() {
      clearInterval(timerInterval);
    }

    function resetTimer() {
      clearInterval(timerInterval);
      remainingTime = 0;
      isStudyTime = true;
      updateTimerDisplay();
    }

    startButton.addEventListener('click', startTimer);
    pauseButton.addEventListener('click', pauseTimer);
    resetButton.addEventListener('click', resetTimer);

    updateTimerDisplay();
  </script>
</body>
</html>
